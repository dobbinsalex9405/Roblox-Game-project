name: CI

# Runs on every pull request and on main. Nothing here can reach Roblox:
# no secrets are available to this workflow.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, test, build, type check
    runs-on: ubuntu-latest
    # The creature-art export grows with every go-live batch (about 9 min on a
    # slow runner at 407 creatures, #155), so 20 minutes no longer covers a
    # slow day.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned tools (rokit.toml)
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0
          cache: true

      - name: Install packages (wally.toml)
        run: wally install
        working-directory: deps

      - name: Format (StyLua)
        run: stylua --check packages games tools playtests

      - name: Lint (Selene)
        run: selene packages games tools playtests

      - name: Tests (Lune)
        run: lune run tools/test/run

      # VoxelArt.luau, CreatureMeshes.luau, CreatureThumbs.luau and EnvArt.luau are generated from tools/art; a
      # hand edit or a stale export fails here.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The export check is a pure function of its inputs (the art tools, the
      # economy tools, the game's config, the committed generated files and
      # this workflow). Once it passes for a set of inputs, the same inputs
      # skip it: a PR that leaves the art alone reuses main's pass.
      - name: Restore the creature-art export pass
        id: art-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci/art-export-ok
          key: art-export-v1-${{ hashFiles('tools/art/**', 'tools/economy/**', 'games/hatchery-heist/config/**', 'games/hatchery-heist/src/shared/VoxelArt.luau', 'games/hatchery-heist/src/shared/CreatureMeshes.luau', 'games/hatchery-heist/src/shared/CreatureThumbs.luau', 'games/hatchery-heist/src/shared/EnvArt.luau', 'games/hatchery-heist/tests/WalkMirror.luau', '.github/workflows/ci.yml') }}
      - name: Creature art is exported (tools/art)
        if: steps.art-cache.outputs.cache-hit != 'true'
        run: |
          python3 tools/art/export.py
          python3 tools/art/blender/luau.py
          python3 tools/art/env/luau.py
          python3 tools/art/to_config.py --check
          python3 tools/economy/even_eggs.py --check
          python3 -m unittest discover -s tools/economy/tests
          python3 -m unittest discover -s tools/art/tests
          git diff --exit-code -- games/hatchery-heist/src/shared/VoxelArt.luau games/hatchery-heist/src/shared/CreatureMeshes.luau games/hatchery-heist/src/shared/CreatureThumbs.luau games/hatchery-heist/src/shared/EnvArt.luau games/hatchery-heist/tests/WalkMirror.luau
          mkdir -p .ci && echo "${{ github.sha }}" > .ci/art-export-ok
      - name: Save the creature-art export pass
        if: steps.art-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/art-export-ok
          key: ${{ steps.art-cache.outputs.cache-primary-key }}

      - name: Build every game (Rojo)
        run: tools/build.sh all

      # A game that fails to start, or breaks its main loop, must not reach main.
      # ops/PUBLISH_CHECKS.md explains both checks.
      - name: Boot every game (server start, player join, client UI)
        run: lune run tools/boot/run all --built

      # The design viewer (tools/designs) exports every model the games build;
      # a game change must not break that export.
      - name: Design viewer builds (every game's models export)
        run: |
          lune run tools/designs/export all
          node tools/designs/build.mjs --drops /nonexistent --out build/design-viewer

      # The same file opened in Studio, where an unpublished place has no
      # DataStores: every game must still start and let a player in.
      - name: Boot every game as an unpublished place in Studio
        run: lune run tools/boot/run all --built --studio --unpublished

      - name: Key flows (headless playtests)
        run: tools/keyflows.sh all

      # What a joining player sees and taps, on Staging builds (real product
      # ids, no secrets): world, spawn, HUD at phone/tablet/desktop, every
      # first-screen button and what it opens. ops/VISUAL_PLAYTEST.md.
      - name: Player's-eye audit (renders + checks)
        run: lune run tools/audit/run all

      - name: Audit summary
        if: always()
        run: |
          for f in build/audit/*/report.md; do
            [ -f "$f" ] && { cat "$f"; echo; } >> "$GITHUB_STEP_SUMMARY"
          done
          true

      - name: Keep the audit images and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ github.sha }}
          path: build/audit
          retention-days: 30
          if-no-files-found: ignore

      - name: Strict type check (luau-lsp)
        run: tools/typecheck.sh

      - name: Keep the built places
        uses: actions/upload-artifact@v4
        with:
          name: places-${{ github.sha }}
          path: build/*.rbxl
          retention-days: 14

  screen-control:
    name: Screen-control guard tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The guard is plain Python; the server itself needs Windows.
      - run: python -m unittest discover -s tools/screen-control/tests -v
