name: Upload creature meshes

# Started by hand (ops/ASSETS.md). Builds Hatchery Heist's creature meshes
# with Blender, uploads them to Roblox as Model assets with the Staging key,
# and opens a draft PR that records the asset ids (tools/art/blender/
# assets.json and the regenerated CreatureMeshes.luau). Nothing reaches
# players until that PR is verified and merged.
#
# With art = thumbs it renders each creature's Hatchery Book picture
# instead (tools/art/blender/thumbs.py), uploads each as an Image asset and
# opens the same kind of draft PR, recording the ids in assets.json and
# CreatureThumbs.luau.
#
# With art = nature it does the same for the outdoor nature instead
# (tools/art/env: trees, bushes, rocks, flowers, the skybox faces and the
# grass tile) and commits the ids (tools/art/env/assets.json, env.json and
# EnvArt.luau) back onto the branch it ran on, or onto a new branch when
# run on main.
on:
  workflow_dispatch:
    inputs:
      art:
        description: "What to upload"
        type: choice
        options: [creatures, thumbs, nature]
        default: creatures
      only:
        description: "Creatures to upload, comma separated (blank = all)"
        required: false
        default: ""
      textures_only:
        description: "Only re-upload the colour images (palettes) of creatures that already have a model"
        type: boolean
        required: false
        default: false
      fresh:
        description: "Upload each creature as a new Model asset, even one that has one (live creatures: Staging keeps the old one until the PR merges)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: creature-meshes
  cancel-in-progress: false

jobs:
  nature:
    if: inputs.art == 'nature'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY_HATCHERY_HEIST }}
      ROBLOX_GROUP_ID: ${{ vars.ROBLOX_GROUP_ID }}
      ONLY: ${{ inputs.only }} # used as "$ONLY", never pasted into a script
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Blender (bpy from pip)
        run: pip install --target="$RUNNER_TEMP/bpy" bpy==5.1.2 pillow

      - name: Build the nature meshes, sky and grass
        run: |
          PYTHONPATH="$RUNNER_TEMP/bpy" python3 tools/art/env/build.py "$RUNNER_TEMP/nature" --no-render
          PYTHONPATH="$RUNNER_TEMP/bpy" python3 tools/art/env/sky.py "$RUNNER_TEMP/images"
          PYTHONPATH="$RUNNER_TEMP/bpy" python3 tools/art/env/grass.py "$RUNNER_TEMP/images"

      - name: Upload to Roblox
        run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          PYTHONPATH="$RUNNER_TEMP/bpy" python3 tools/art/env/upload.py "$RUNNER_TEMP/nature" "$RUNNER_TEMP/images" "${args[@]}"

      - name: Record the asset ids
        run: python3 tools/art/env/luau.py

      - name: Commit the ids
        run: |
          files=(tools/art/env/assets.json tools/art/env/env.json games/hatchery-heist/src/shared/EnvArt.luau)
          if git diff --quiet -- "${files[@]}" && [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "No asset ids changed."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          target="$BRANCH"
          if [ "$target" = "main" ]; then
            target="nature-assets/${{ github.run_id }}"
            git checkout -b "$target"
          fi
          git add "${files[@]}"
          git commit -m "Hatchery Heist: nature asset ids (run ${{ github.run_id }})"
          git push origin "HEAD:refs/heads/$target"
          echo "::notice::Pushed the ids to $target"

  upload:
    if: inputs.art != 'nature'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY_HATCHERY_HEIST }}
      ROBLOX_GROUP_ID: ${{ vars.ROBLOX_GROUP_ID }} # optional; otherwise looked up from the Staging universe
      ONLY: ${{ inputs.only }} # used as "$ONLY", never pasted into a script
      TEXTURES_ONLY: ${{ inputs.textures_only }}
      FRESH: ${{ inputs.fresh }}
      ART: ${{ inputs.art }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Blender (bpy from pip)
        run: pip install --target="$RUNNER_TEMP/bpy" bpy==5.1.2 pillow

      - name: Build the meshes (or the Book pictures)
        run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ "$ART" = "thumbs" ]; then args+=(--thumbs); else args+=(--no-render); fi
          PYTHONPATH="$RUNNER_TEMP/bpy" python3 tools/art/blender/build.py "$RUNNER_TEMP/meshes" "${args[@]}"

      - name: Check every FBX is at rest
        # A posed FBX is baked into the meshes by Roblox's importer, and the
        # game then draws that part out of place (fbx_check.py).
        if: inputs.art != 'thumbs'
        run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          PYTHONPATH="$RUNNER_TEMP/bpy" python3 tools/art/blender/fbx_check.py "$RUNNER_TEMP/meshes" "${args[@]}"

      - name: Upload to Roblox
        run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ "$TEXTURES_ONLY" = "true" ]; then args+=(--textures-only); fi
          if [ "$FRESH" = "true" ]; then args+=(--fresh); fi
          if [ "$ART" = "thumbs" ]; then args+=(--thumbs); fi
          python3 tools/art/blender/upload.py "$RUNNER_TEMP/meshes" "${args[@]}"

      - name: Record the asset ids
        run: python3 tools/art/blender/luau.py

      - name: Open a draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "No asset ids changed."; exit 0; fi
          kind=meshes
          if [ "$ART" = "thumbs" ]; then kind=thumbs; fi
          branch="creature-$kind/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add tools/art/blender/assets.json games/hatchery-heist/src/shared/CreatureMeshes.luau games/hatchery-heist/src/shared/CreatureThumbs.luau
          git commit -m "Hatchery Heist: creature $kind asset ids (run ${{ github.run_id }})"
          git push -u origin "$branch"
          gh pr create --draft --base "${{ github.ref_name }}" --head "$branch" \
            --title "Hatchery Heist: creature $kind asset ids" \
            --body "Asset ids from the Upload creature meshes run ${{ github.run_id }}. Needs the visual playtest before merge (ops/ASSETS.md)." \
            || echo "::notice::Pushed $branch; Actions may not open PRs in this repo, so open one from it by hand."
