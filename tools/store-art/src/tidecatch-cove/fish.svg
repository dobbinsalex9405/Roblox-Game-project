            fill="url(#fishBody)" stroke="#2A1240" stroke-width="9"/>
      <!-- belly -->
      <path d="M-80 36 C-50 76 40 86 100 50 C90 78 56 92 14 92 C-34 92 -70 70 -80 36 Z" fill="#FFF3B8" opacity="0.85"/>
      <!-- stripes -->
      <path d="M-36 -88 C-56 -40 -56 40 -40 86" stroke="#F0582A" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.55"/>
      <!-- shine -->
      <path d="M-20 -70 C10 -82 50 -80 76 -62" stroke="#FFFBE0" stroke-width="11" fill="none" stroke-linecap="round" opacity="0.9"/>
      <!-- eye -->
      <circle cx="54" cy="-22" r="34" fill="#FFFFFF" stroke="#2A1240" stroke-width="8"/>
      <circle cx="64" cy="-20" r="20" fill="#2A1240"/>
      <circle cx="71" cy="-29" r="8" fill="#FFFFFF"/>
      <circle cx="58" cy="-12" r="4" fill="#FFFFFF"/>
      <!-- cheek -->
      <ellipse cx="72" cy="28" rx="16" ry="10" fill="#FF6B6B" opacity="0.55"/>
      <!-- mouth: open happy grin -->
      <path d="M100 22 C112 46 128 46 128 20 C120 24 110 24 100 22 Z" fill="#7A1F3D" stroke="#2A1240" stroke-width="7" stroke-linejoin="round"/>
      <!-- pectoral fin -->
      <path d="M-6 26 C-16 60 -50 72 -64 62 C-56 42 -36 26 -6 26 Z" fill="url(#fishFin)" stroke="#2A1240" stroke-width="8" stroke-linejoin="round"/>
    </g>
