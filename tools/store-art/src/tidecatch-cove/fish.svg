    <!-- Tidecatch hero fish ("Sunny"), local coords, body ~ 240 x 190, faces right -->
    <linearGradient id="fishBody" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFE45C"/><stop offset="0.55" stop-color="#FFB13B"/><stop offset="1" stop-color="#FF7A2E"/>
    </linearGradient>
    <linearGradient id="fishFin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9B3D"/><stop offset="1" stop-color="#F0582A"/>
    </linearGradient>
    <g id="heroFish">
      <!-- tail -->
      <path d="M-92 -6 C-130 -60 -168 -70 -176 -58 C-168 -30 -160 -10 -150 2 C-162 16 -170 40 -176 66 C-160 74 -124 54 -92 12 Z"
