<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style>/*FONTS*/</style>
  <defs>
<!--INCLUDE:parts/common-defs.svg-->
<!--INCLUDE:street-food-empire/parts.svg-->
<!--INCLUDE:parts/avatar.svg-->
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#3A3FA0"/><stop offset="0.6" stop-color="#1E2160"/><stop offset="1" stop-color="#0D1020"/>
    </radialGradient>
    <radialGradient id="warm" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFB547" stop-opacity="0.55"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="250" r="230" fill="url(#warm)"/>
  <!-- emblem loop behind the cart -->
  <g>
    <circle cx="256" cy="250" r="226" fill="none" stroke="url(#emRing)" stroke-width="24"
            stroke-linecap="round" stroke-dasharray="1170 250" transform="rotate(-60 256 250)"/>
    <polygon points="170,34 100,38 142,96" fill="url(#emRing)" stroke="url(#emRing)" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <ellipse cx="262" cy="446" rx="180" ry="20" fill="#05061A" opacity="0.5"/>
  <g filter="url(#dropShadow)">
    <!-- chef behind the counter -->
    <g transform="translate(236 252) scale(0.82)" style="--skin:#FFD9A8;--shirt:#FFFFFF">
      <rect x="-46" y="-6" width="92" height="40" rx="12" fill="#FFFFFF" stroke="#1B1238" stroke-width="7"/>
      <use href="#avatarHead"/><use href="#hatPaper"/>
    </g>
    <use href="#hotdogCart" transform="translate(250 278) scale(0.95)"/>
    <use href="#hotdogBig" transform="translate(258 104) rotate(-6) scale(0.6)"/>
  </g>
  <use href="#steam" transform="translate(262 66) scale(0.5)"/>
  <!-- coins popping out -->
  <g filter="url(#dropShadow)">
    <use href="#coin" transform="translate(70 214) rotate(-14) scale(1.15)"/>
    <use href="#coin" transform="translate(452 200) rotate(12) scale(1.05)"/>
    <use href="#coin" transform="translate(440 300) rotate(-8) scale(0.8)"/>
  </g>
  <g fill="#FFF2A8">
    <use href="#spark" transform="translate(110 140) scale(1.3)"/>
    <use href="#spark" transform="translate(404 116) scale(1.1)"/>
    <use href="#spark" transform="translate(66 330) scale(0.9)"/>
  </g>
</svg>
