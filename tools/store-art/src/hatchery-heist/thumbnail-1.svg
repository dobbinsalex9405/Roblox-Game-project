<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <style>/*FONTS*/
    .big{font-family:'Lilita One';letter-spacing:3px}
  </style>
  <defs>
<!--INCLUDE:parts/common-defs.svg-->
<!--INCLUDE:parts/avatar.svg-->
<!--INCLUDE:hatchery-heist/parts.svg-->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A1E8A"/><stop offset="0.6" stop-color="#8A4DFF"/><stop offset="1" stop-color="#FF9ACF"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ADB6A"/><stop offset="1" stop-color="#2E9A4A"/>
    </linearGradient>
    <radialGradient id="legendGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE9A0" stop-opacity="0.95"/><stop offset="0.45" stop-color="#FFAA28" stop-opacity="0.45"/><stop offset="1" stop-color="#FFAA28" stop-opacity="0"/>
    </radialGradient>
    <!-- base platform with pads -->
    <g id="basePad">
      <ellipse cx="0" cy="0" rx="300" ry="70" fill="#C9B8FF" stroke="#1B1238" stroke-width="8"/>
      <ellipse cx="0" cy="-12" rx="280" ry="58" fill="#E6DCFF" stroke="#1B1238" stroke-width="6"/>
      <g fill="#B56BFF" stroke="#1B1238" stroke-width="5"><ellipse cx="-170" cy="-14" rx="46" ry="16"/><ellipse cx="0" cy="-30" rx="46" ry="16"/><ellipse cx="170" cy="-14" rx="46" ry="16"/></g>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <g fill="#FFFFFF" opacity="0.5"><circle cx="880" cy="80" r="3"/><circle cx="1100" cy="150" r="2.5"/><circle cx="1500" cy="60" r="3"/><circle cx="1820" cy="200" r="2.5"/></g>
  <!-- other bases in the ring -->
  <g opacity="0.85">
    <g transform="translate(1600 600) scale(0.6)"><use href="#basePad"/>
      <use href="#eggWhole" transform="translate(-170 -60) scale(0.5)" style="--egg:#FFFBEA;--spot:#5AC85A"/><use href="#eggWhole" transform="translate(0 -76) scale(0.5)" style="--egg:#E8F0FF;--spot:#468CFF"/><use href="#eggWhole" transform="translate(170 -60) scale(0.5)" style="--egg:#FFFBEA;--spot:#FFB547"/></g>
  </g>
  <path d="M-20 660 C400 620 900 640 1940 650 V1100 H-20 Z" fill="url(#grass)" stroke="#1B1238" stroke-width="8"/>
  <!-- owner's base, left -->
  <g transform="translate(330 760)"><use href="#basePad"/>
    <use href="#chick" transform="translate(-170 -24) scale(0.8)"/>
    <use href="#penguin" transform="translate(170 -22) scale(0.7)"/>
    <ellipse cx="0" cy="-30" rx="46" ry="16" fill="#FF5A6E" opacity="0.6"/>
  </g>
  <!-- red alarm -->
  <g transform="translate(330 560)" class="big" text-anchor="middle">
    <rect x="-150" y="-50" width="300" height="84" rx="42" fill="#FF3B4E" stroke="#1B1238" stroke-width="8"/>
    <text y="14" font-size="56" fill="#FFFFFF">RAID!</text>
  </g>

  <!-- owner chasing on their Dragonling (rider sits behind its head) -->
  <g transform="translate(700 990)">
    <ellipse cx="0" cy="0" rx="150" ry="20" fill="#1B1238" opacity="0.25"/>
  </g>
  <g transform="translate(690 790) rotate(6) scale(0.7)" style="--shirt:#FFD23F;--pants:#2B3A67">
    <use href="#avatarArm" transform="translate(-42 -94) rotate(30)"/>
    <use href="#avatarTorso"/>
    <use href="#avatarHead" transform="translate(0 -102)"/>
    <use href="#avatarArm" transform="translate(42 -94) rotate(-100)"/>
  </g>
  <g transform="translate(700 990) rotate(8)">
    <use href="#dragonlingPlain" transform="translate(0 -110) scale(0.62)"/>
  </g>
  <!-- the owner's shout -->
  <g transform="translate(560 600)" class="big" text-anchor="middle">
    <path d="M-60 -46 H60 a20 20 0 0 1 20 20 V20 a20 20 0 0 1 -20 20 H20 L40 74 L-6 40 H-60 a20 20 0 0 1 -20 -20 V-26 a20 20 0 0 1 20 -20 Z" fill="#FFFFFF" stroke="#1B1238" stroke-width="7" stroke-linejoin="round"/>
    <text y="22" font-size="64" fill="#FF3B4E">!!</text>
  </g>
  <!-- speed lines -->
  <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.7">
    <path d="M440 840 h-120"/><path d="M470 900 h-160"/><path d="M450 960 h-110"/>
    <path d="M1010 760 h-130"/><path d="M1000 830 h-170"/><path d="M1020 900 h-110"/>
  </g>

  <!-- the thief, running off with a Legendary Phoenix -->
  <circle cx="1250" cy="600" r="250" fill="url(#legendGlow)"/>
  <g transform="translate(1230 920) rotate(10)" style="--shirt:#1B1238;--pants:#2B3A67;--skin:#FFD9A8">
    <ellipse cx="0" cy="80" rx="120" ry="18" fill="#1B1238" opacity="0.25" transform="rotate(-10)"/>
    <use href="#avatarLeg" transform="translate(-18 0) rotate(40)"/>
    <use href="#avatarLeg" transform="translate(18 0) rotate(-36)"/>
    <use href="#avatarArm" transform="translate(-42 -84) rotate(160)"/>
    <use href="#avatarTorso"/>
    <use href="#avatarArm" transform="translate(42 -84) rotate(-170)"/>
    <g transform="translate(0 -92)">
      <use href="#avatarHead"/>
      <use href="#banditMask" transform="translate(0 -46) scale(0.42)"/>
      <circle cx="-14" cy="-46" r="7" fill="#FFFFFF"/><circle cx="16" cy="-46" r="7" fill="#FFFFFF"/>
      <circle cx="-12" cy="-46" r="4" fill="#1B1238"/><circle cx="18" cy="-46" r="4" fill="#1B1238"/>
    </g>
  </g>
  <use href="#phoenix" transform="translate(1262 610) rotate(8) scale(0.82)"/>
  <g transform="translate(1270 420) rotate(4)" class="big" text-anchor="middle">
    <rect x="-170" y="-44" width="340" height="80" rx="40" fill="#FFAA28" stroke="#1B1238" stroke-width="7"/>
    <text y="14" font-size="52" fill="#1B1238">LEGENDARY</text>
  </g>
  <g fill="#FFF2A8"><use href="#spark" transform="translate(1480 500) scale(1.8)"/><use href="#spark" transform="translate(1040 520) scale(1.3)"/><use href="#spark" transform="translate(1450 720) scale(1)"/></g>

  <!-- logo -->
  <g class="big" filter="url(#dropShadow)">
    <text x="60" y="180" font-size="170" fill="#FFFFFF" stroke="#1B1238" stroke-width="18" paint-order="stroke" stroke-linejoin="round">HATCHERY</text>
    <text x="64" y="350" font-size="190" fill="url(#titleGold)" stroke="#3A1A0B" stroke-width="18" paint-order="stroke" stroke-linejoin="round" letter-spacing="10">HEIST</text>
  </g>
  <g class="big" filter="url(#dropShadow)" text-anchor="end">
    <text x="1870" y="170" font-size="84" fill="#FFFFFF" stroke="#1B1238" stroke-width="14" paint-order="stroke" stroke-linejoin="round">HATCH · RIDE · <tspan fill="url(#titleGold)">STEAL</tspan></text>
  </g>
  <use href="#studioBadge" transform="translate(40 970)"/>
</svg>
